<!DOCTYPE html>
<!-- lang = en hjälper skärmläsaren att uttala texten på engleska-->

<head>
    <!--UTF-8 stöder svenska tecken(å,ä,ö ) och emoji -->
    <meta charset="UTF-8">
    <!-- beskriving av sidan visas i sökresultat(chrome, edge eller firefox)-->
    <meta name="description" content="With us you can read about film that are trending and read their reviews. No Ads and easy to find and read about films. You can even affect the film rating by giving feedbacks. ">
    <!--viewport gör att sidan skalas rätt på mobil utan det ser mobilen sidan som en desktop-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- kopplar in CSS-filen stype.css-->

    <!--Titeln visas i webbläsarfliken och i bokmärken-->
    <title>Film Rating</title>

        <header>

            <div id="logo">

            <input  id="searchInput" type="text" placeholder="Star Wars A New Hope">

            <div id="unseenable">
